spring:
  application:
    name: sca-web
  cloud:
    # Sentinel 流控配置
    sentinel:
      transport:
        dashboard: 47.116.45.17:8858
        port: 8719
    #eager: false	懒加载	Sentinel 拦截器在第一次请求时才初始化，导致 @SentinelResource 的 AOP 切面不生效，限流规则加载了但不触发
    #eager: true	立即初始化	启动时就初始化 Sentinel，AOP 切面生效，限流规则正常触发
      eager: true
      # URL 清洗：合并 RESTful 路径变量（如 /api/hotel/order/123 → /api/hotel/order/{id}）
      web-context-unify: true
      # Nacos 动态数据源 —— 限流规则 + 熔断规则 + 授权规则
      datasource:
        flow:
          nacos:
            server-addr: 47.116.45.17:8848
            data-id: ${spring.application.name}-sentinel-flow
            group-id: SENTINEL_GROUP
            username: ${nacos.username}
            password: ${nacos.password}
            rule-type: flow
        degrade:
          nacos:
            server-addr: 47.116.45.17:8848
            data-id: ${spring.application.name}-sentinel-degrade
            group-id: SENTINEL_GROUP
            username: ${nacos.username}
            password: ${nacos.password}
            rule-type: degrade
        # 授权规则：来源访问控制，配合 SentinelConfig 中的 RequestOriginParser（请求头 originSource）
        authority:
          nacos:
            server-addr: 47.116.45.17:8848
            data-id: ${spring.application.name}-sentinel-authority
            group-id: SENTINEL_GROUP
            username: ${nacos.username}
            password: ${nacos.password}
            rule-type: authority
    nacos:
      discovery:
        server-addr: 47.116.45.17:8848
        username: ${nacos.username}
        password: ${nacos.password}
      config:
        refresh-enabled: false
        server-addr: 47.116.45.17:8848
        username: ${nacos.username}
        password: ${nacos.password}
        file-extension: yml
        group: DEFAULT_GROUP
        prefix: ${spring.application.name}
        # 共享配置：所有服务公共配置（MySQL/Redis/MyBatis等）
        shared-configs:
          - data-id: common-config.yml
            group: DEFAULT_GROUP
            refresh: true
        # 共享配置（多个微服务共用的基础配置）
        shared-configs:
          - data-id: sca-common.yml
            group: SHARED_GROUP
            refresh: false
#        extension-configs:
#          - data-id: sca-web.yml
#            group: EXTEND_GROUP
#            refresh: true
feign:
  sentinel:
    enabled: true   #开启sentinel对feign的支持 默认false
    enable-refresh-rules: true


#暴露actuator端点   http://localhost:8800/actuator/sentinel
management:
  endpoints:
    web:
      exposure:
        include: '*'
