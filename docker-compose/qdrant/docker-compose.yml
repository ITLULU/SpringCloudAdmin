services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST API（自带 Web 控制台 /dashboard）
      - "6334:6334"   # gRPC API（Spring AI spring-ai-starter-vector-store-qdrant 走此口）
    environment:
      TZ: Asia/Shanghai
      # 可选鉴权：配合全局环境变量 QDRANT_API_KEY 注入，空值则不启用
      # 注意：不要用 {xxx} 花括号占位符（会被 YAML 解析为对象导致校验失败）
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
      - ./data/qdrant_snapshots:/qdrant/snapshots
    networks:
      - my-custom-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  my-custom-network:
    external: true
    name: my-custom-network