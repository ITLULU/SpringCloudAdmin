brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# NameServer 地址（指向同一 compose 中的 namesrv 服务）
namesrvAddr = rmqnamesrv:9876

# 自动创建 Topic 和订阅组（开发环境开启，生产建议关闭）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# Broker 对外暴露的 IP。
# 若微服务运行在宿主机（非同一 docker 网络），需改为你宿主机的局域网 IP，
# 否则客户端会拿到容器内网 IP 导致连接失败。例如：brokerIP1 = 192.168.1.100
# 若微服务与 broker 同在 my-custom-network 网络中，可保持注释。
# brokerIP1 = 192.168.1.100

# 存储路径
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
