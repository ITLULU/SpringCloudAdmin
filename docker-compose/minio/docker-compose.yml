services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API / S3 兼容端点（对应 application.yaml askbase.storage.minio.endpoint）
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data
      - ./logs:/var/log/minio
    networks:
      - my-custom-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性初始化：创建 askbase bucket（对应 application.yaml askbase.storage.minio.bucket）
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/askbase &&
      echo 'bucket askbase ready'"
    networks:
      - my-custom-network

networks:
  my-custom-network:
    external: true
    name: my-custom-network