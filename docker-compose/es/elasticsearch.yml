# Elasticsearch 集群配置
# 此文件可用于覆盖默认配置

cluster:
  name: es-docker-cluster
  
node:
  name: ${HOSTNAME}
  
network:
  host: 0.0.0.0
  
http:
  port: 9200
  
transport:
  port: 9300

discovery:
  seed_hosts: es01, es02, es03
  
cluster.initial_master_nodes: es01, es02, es03

bootstrap:
  memory_lock: true

xpack:
  security:
    enabled: false

# 内存设置
indices:
  memory:
    index_buffer_size: 20%

# 线程池设置
thread_pool:
  write:
    size: 4
    queue_size: 1000
