# ==========================================
# sca-datasync 服务私有配置
# ==========================================
server:
  port: 8084

spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  kafka:
    # 单 broker 接入（docker-compose/kafka 为单节点）；集群接入时逗号分隔多地址
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sca-datasync-group
  datasource:
    url: jdbc:mysql://localhost:3306/sca_order_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: website
    password: website1020
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 600000
      idle-timeout: 300000
      minimum-idle: 5
      maximum-pool-size: 20
      connection-test-query: SELECT 1
      connection-timeout: 30000
      validation-timeout: 5000
  elasticsearch:
    # 单节点接入；集群接入（docker-compose-cluster.yml 启动 es01/02/03）时改为逗号分隔多地址，
    # 客户端自动负载均衡与故障转移，如：http://host:9200,http://host:9201,http://host:9202
    uris: http://localhost:9200

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID

# Kafka Topic 配置
kafka:
  topic:
    order-create: topic-order-create
    order-status-change: topic-order-status-change
    # Sentinel 拦截审计事件（来自 sca-web BlockAuditSlot）
    sentinel-block: topic-sentinel-block
